<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You are offline — SaleBari</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F0; color: #0F2A24; font-family: "Times New Roman", Times, "Noto Sans Bengali", serif; text-align: center; padding: 24px; }
  main { max-width: 420px; }
  .mark { width: 72px; height: 72px; border-radius: 18px; background: #0F2A24; color: #C9A961; display: grid; place-items: center; font-size: 30px; font-weight: 700; margin: 0 auto 18px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: #55635C; line-height: 1.6; margin: 0 0 18px; }
  button { background: #0F2A24; color: #FAF7F0; border: 0; border-radius: 999px; padding: 12px 24px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="mark">SB</div>
  <h1>You are offline</h1>
  <p>SaleBari needs an internet connection to show listings and prices. Check your mobile data or Wi-Fi, then try again.</p>
  <p lang="bn">ইন্টারনেট সংযোগ নেই। মোবাইল ডেটা বা ওয়াই-ফাই চেক করে আবার চেষ্টা করুন।</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
